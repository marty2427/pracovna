name: build
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalace
        working-directory: app
        run: npm ci
      - name: Typová kontrola
        working-directory: app
        run: npx tsc -b --noEmit
      - name: Build
        working-directory: app
        run: npm run build
